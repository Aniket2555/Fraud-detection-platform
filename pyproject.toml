[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "0.1.0"
description = "Real-time fraud detection platform — shared package namespace for databricks/src and ml code"
requires-python = ">=3.11"

# The repo's Databricks notebooks/tests and ml/ pipeline code import a
# single `fraud_detection` namespace (e.g. `fraud_detection.features.*`,
# `fraud_detection.transformations.*`, `fraud_detection.ml.training.*`)
# even though the actual source lives under two separate physical roots:
# databricks/src/ and ml/. `pip install -e .` from the repo root makes
# that namespace resolve correctly for both local dev and CI.
#
# Auto-discovery can't follow this dual-root remapping, so packages are
# listed explicitly below. Any package not given its own entry in
# package-dir resolves relative to its nearest mapped ancestor, e.g.
# fraud_detection.ml.training -> ml/training.
[tool.setuptools]
package-dir = { "fraud_detection" = "databricks/src", "fraud_detection.ml" = "ml" }
packages = [
    "fraud_detection",
    "fraud_detection.features",
    "fraud_detection.transformations",
    "fraud_detection.quality",
    "fraud_detection.security",
    "fraud_detection.mlops",
    "fraud_detection.schemas",
    "fraud_detection.ml",
    "fraud_detection.ml.training",
    "fraud_detection.ml.training.models",
    "fraud_detection.ml.training.utils",
    "fraud_detection.ml.ensemble",
    "fraud_detection.ml.serving",
    "fraud_detection.ml.pipelines",
    "fraud_detection.ml.data_augmentation",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]
